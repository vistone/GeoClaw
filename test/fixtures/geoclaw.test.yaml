log:
  level: warn

rocktree:
  baseUrl: https://kh.google.com/rt/earth

fetch:
  contextHeaders:
    Origin: https://earth.google.com
    Referer: https://earth.google.com/
  forceIdentityEncoding: true
  logTransportTrace: false
  timeoutMs: null

tls:
  profile: chrome_128
  platform: linux
  http2: true
  profileHeaders: true

proxy:
  enabled: true
  url: socks5://127.0.0.1:20170
  mode: auto

hostPin:
  enabled: true
  hostname: kh.google.com
  ipsFile: test/fixtures/kh.test-ips.yaml
  family: all

benchmark:
  concurrency: 5
  timeoutMs: 15000
  outDir: benchmark
  planetoidPath: PlanetoidMetadata

warmPool:
  enabled: false
  ipsFile: null
  warmupPath: null
  poolIdleTimeout: false
  poolMaxIdlePerHost: 1
  deniedStatuses: [403, 429]
  successStatus: 200
  initialConcurrency: 2
  reheatConcurrency: 1
  reheatIntervalMs: 5000
  reheatBackoffMs: 1000
  deniedBackoffMs: 2000
  fallbackToHostPin: true

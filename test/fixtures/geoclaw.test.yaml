log:
  level: warn

rocktree:
  baseUrl: https://kh.google.com/rt/earth

fetch:
  contextHeaders:
    Origin: https://earth.google.com
    Referer: https://earth.google.com/
  forceIdentityEncoding: true
  logTransportTrace: false
  timeoutMs: null

tls:
  profile: chrome_128
  platform: linux
  http2: true
  profileHeaders: true

proxy:
  enabled: true
  url: socks5://127.0.0.1:20170
  mode: auto

hostPin:
  enabled: true
  hostname: kh.google.com
  ipsFile: test/fixtures/kh.test-ips.yaml
  configDir: config
  family: all

benchmark:
  concurrency: 5
  timeoutMs: 15000
  outDir: benchmark
  planetoidPath: PlanetoidMetadata

warmPool:
  enabled: false
  ipsFile: null
  warmupPath: null
  poolIdleTimeout: false
  poolMaxIdlePerHost: 1
  deniedStatuses: [403, 429]
  coldPoolStatuses: [403, 429]
  successStatus: 200
  autoStartWarmup: false
  concurrency: 2
  reheatIntervalMs: 5000
  backoffMs: 0
  fallbackToHostPin: true
  maxTaskAttempts: null
  idleExpireMs: 60000

fetchMetrics:
  enabled: true
  logEachAttempt: false
  summaryIntervalMs: 0
  maxRecentAttempts: 100
  maxRecentRequests: 50
  maxRecentFlightPaths: 50
  ipStatsDir: null
  ipStatsFlushIntervalMs: 0
  ipStatsSeedFromHostPin: false

fetchRoute:
  originMode: manual
  origin:
    lat: 39.9042
    lng: 116.4074
    city: Beijing
    country: CN
    label: client
  includeProxyHop: false
  ipinfoForSystemDns: false

ipinfo:
  enabled: false
  token: null
  baseUrl: https://ipinfo.io
  cacheTtlMs: 60000
  timeoutMs: 3000
  originViaProxy: false

flightMap:
  host: 127.0.0.1
  port: 8765
  mapStyleUrl: https://demotiles.maplibre.org/style.json
  tileUrl: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  tileProvider: bing
  bingImagerySet: Road
  bingMapsKey: null
  geojsonIoUrl: https://geojson.io
  pollIntervalMs: 5000
  demoFetchOnStart: false
  demoFetchUrl: null
  earthRadiusKm: 6371
  leoAltitudeMinKm: 12
  leoAltitudeMaxKm: 48
  orbitDisplayExaggeration: 2.5
  routeDrawMs: 1400
  routeHoldMs: 500
  routeFadeMs: 2800
  stressConcurrency: 5
  stressTotal: null
  stressOnStart: false

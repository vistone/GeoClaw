# GeoClaw 运行时配置（可调参数只写这里，不要在 src/ 硬编码）
# 相对路径均相对于项目根目录；可用环境变量 GEOCLAW_CONFIG 指定其它文件

# ---------- 日志 ----------
log:
  # 级别：debug | info | warn | error | silent（debug 会打各对象耗时）
  level: info

# ---------- Rocktree API ----------
rocktree:
  # Planetoid / Bulk / Node 请求的根 URL（末尾不要多余路径）
  baseUrl: https://kh.google.com/rt/earth

# ---------- 通用 HTTP 抓取 ----------
fetch:
  # 附加到每次请求的浏览器上下文头（模拟来自 Earth 网页）
  contextHeaders:
    Origin: https://earth.google.com
    Referer: https://earth.google.com/
  # true：强制 Accept-Encoding: identity，避免 gzip 干扰原始 protobuf 字节
  forceIdentityEncoding: true
  # true：每次请求打印传输 trace（profile、是否 H2、耗时等）
  logTransportTrace: false
  # 热池/业务请求超时（毫秒）；高并发经代理时 2s 易大面积超时→传输失败掏空热池；null=不限制
  timeoutMs: 15000

# ---------- TLS / 浏览器指纹（node-wreq） ----------
tls:
  # 浏览器 TLS 指纹 profile 名（如 chrome_128）
  profile: chrome_128
  # 指纹对应操作系统：linux | windows | macos 等
  platform: linux
  # true：启用 HTTP/2 指纹模拟
  http2: true
  # true：由 profile 自动填充常见浏览器请求头
  profileHeaders: true

# ---------- 出站代理 ----------
proxy:
  # false：全程直连，忽略 url
  enabled: true
  # 代理地址（socks5:// 或 http://）
  url: socks5://127.0.0.1:20170
  # auto=仅 IPv6 走代理；always=全部走代理；never=从不走代理
  mode: auto

# ---------- HostPin（按 YAML IP 列表直连，绕过系统 DNS） ----------
hostPin:
  # false：不启用 HostPin，走系统 DNS
  enabled: true
  # 要 pin 的主机名（须与 ipsFile 内记录匹配）
  hostname: kh.google.com
  # IP 列表 YAML（含 geo 字段时可画航线/统计地区）
  ipsFile: config/kh.google.com.yaml
  # 按「域名.yaml」自动查找 HostPin 文件时的目录
  configDir: config
  # 选用地址族：all | ipv4 | ipv6
  family: all

# ---------- benchmark:kh-ips 脚本默认值 ----------
benchmark:
  # 并发探测数
  concurrency: 200
  # 单次探测超时（毫秒）
  timeoutMs: 20000
  # 结果输出目录
  outDir: benchmark
  # 相对 rocktree.baseUrl 的探测路径（也作热池默认预热 URL）
  planetoidPath: PlanetoidMetadata

# ---------- 热连接池（每 IP 一条可复用 HTTP/2） ----------
warmPool:
  # false：关闭热池，WebFetch 走冷路径（HostPin/系统 DNS）
  enabled: true
  # 预热用 IP 列表；null=复用 hostPin.ipsFile
  ipsFile: null
  # 预热请求路径；null=复用 benchmark.planetoidPath
  warmupPath: null
  # node-wreq 连接池空闲超时；false=不额外限制
  poolIdleTimeout: false
  poolMaxIdlePerHost: 1
  # 这些 HTTP 状态移出热池并重热
  deniedStatuses: [403, 429]
  coldPoolStatuses: [403, 429]
  successStatus: 200
  autoStartWarmup: true
  # 仅热池运维并发：首轮预热 / 后台重热 / 保活（与压测、业务下载无关）
  concurrency: 200
  # 仅业务下载任务池并发（WebFetch 热路径发请求的 worker 数；与热池运维 concurrency 分开）
  taskConcurrency: 500
  # 后台重热轮询间隔（毫秒）
  reheatIntervalMs: 5000
  # 失败后统一退避（毫秒）；0=尽快再试，不人为卡很久
  backoffMs: 0
  # true：无热连接时允许 HostPin 冷路径
  fallbackToHostPin: false
  # 单任务最大尝试次数；null=不限制
  maxTaskAttempts: null
  # 空闲窗口（毫秒）：用于保活续命；0=关闭保活
  idleExpireMs: 60000

# ---------- 请求指标与 IP 统计 ----------
fetchMetrics:
  # false：不记录指标（地图/统计面板数据会空）
  enabled: true
  # true：每次 attempt 打一条日志（很吵，调试用）
  logEachAttempt: false
  # 周期性摘要日志间隔（毫秒）；0=不打摘要
  summaryIntervalMs: 30000
  # 内存中保留的最近 attempt 条数（环形缓冲）
  maxRecentAttempts: 1000
  # 内存中保留的最近完整请求条数
  maxRecentRequests: 500
  # 内存中保留的最近飞行路线条数（供地图拉取）
  maxRecentFlightPaths: 500
  # IP 统计 YAML 目录：config/ip-stats/<hostname>.yaml；null=不落盘
  ipStatsDir: config/ip-stats
  # 统计刷盘间隔（毫秒）；0=仅进程退出或显式 flush 时写
  ipStatsFlushIntervalMs: 5000
  # true：config/ip-stats/<域名>.yaml 不存在时，用 config/<域名>.yaml（HostPin）建零计数统计素材并落盘
  ipStatsSeedFromHostPin: true

# ---------- 出站：进站成功后的响应原样 PUT（与进站 fetch 严格分离） ----------
fetchExport:
  # false：不 PUT；true 且 url 非空时，每次 WebFetch 进站 200 后原样上传
  enabled: false
  # 固定 PUT（出站写存储）
  method: PUT
  # PUT 完整 URL；null=未配置，即使 enabled 也不发
  url: null
  # 出站专用头（不继承 fetch.contextHeaders / TLS profile；按存储方约定自行写全）
  headers:
    Content-Type: application/octet-stream
  # 出站超时（毫秒）；null=不限制
  timeoutMs: null
  # 出站是否走全局 proxy：never | always | auto（默认 never，存档直连）
  proxyMode: never
  # true：PUT 失败只记日志，进站仍把原字节返回给调用方
  failOpen: true

# ---------- 飞行路线 origin / 目标解析 ----------
fetchRoute:
  # origin 来源：ipinfo=查本机出口 IP 坐标；manual=用下面 origin 字段
  originMode: ipinfo
  # originMode=manual 时的客户端坐标；ipinfo 模式下忽略
  origin: null
  # true：航线中插入代理节点（需 proxy.geo）；当前可视化默认关闭
  includeProxyHop: false
  # true：系统 DNS 路径下也用 ipinfo 解析目标 IP/域名坐标
  ipinfoForSystemDns: true

# ---------- ipinfo.io ----------
ipinfo:
  # false：禁用 ipinfo（originMode=ipinfo 时将无法自动取出口坐标）
  enabled: true
  # API token：YAML 保持 null；本地测试写项目根 .env 的 IPINFO_TOKEN（见 .env.example）
  token: null
  # ipinfo API 根 URL
  baseUrl: https://ipinfo.io
  # 查询结果内存缓存 TTL（毫秒）
  cacheTtlMs: 3600000
  # 单次 ipinfo HTTP 超时（毫秒）
  timeoutMs: 5000
  # true：查「本机出口」时也走 proxy.url（出口变成代理侧）
  originViaProxy: false

# ---------- 飞行地图（npm run flight:map） ----------
flightMap:
  # HTTP/WS 监听地址（0.0.0.0=局域网可访问；仅本机用 127.0.0.1）
  host: 0.0.0.0
  # 监听端口（浏览器打开 http://<本机IP>:port）
  port: 8765
  # 备用 MapLibre style URL（tileProvider 不用时或调试用）
  mapStyleUrl: https://demotiles.maplibre.org/style.json
  # tileProvider=custom 时的栅格瓦片模板（含 {z}/{x}/{y}）
  tileUrl: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  # 底图：bing=必应栅格；custom=使用上面 tileUrl
  tileProvider: bing
  # Bing 图层：Road | Aerial | AerialWithLabels
  bingImagerySet: Road
  # Bing Maps Key；也可用环境变量 BING_MAPS_KEY；null=走公开瓦片回退
  bingMapsKey: null
  # 「在 geojson.io 打开」按钮的基址
  geojsonIoUrl: https://geojson.io
  # 前端轮询/状态刷新间隔（毫秒）
  pollIntervalMs: 3000
  # true：服务启动后自动发一次演示请求（画出一条样例航线）
  demoFetchOnStart: true
  # 演示请求 URL；null=自动用 rocktree + planetoidPath
  demoFetchUrl: null
  # 地球半径 (km)，用于弹道弧/拱高计算（显示用，非精密大地测量）
  earthRadiusKm: 6371
  # 航线显示用「轨道高度」下限 (km)，影响弧拱高度随机/分配区间
  leoAltitudeMinKm: 12
  # 航线显示用「轨道高度」上限 (km)
  leoAltitudeMaxKm: 48
  # 平面地图上对轨道拱高的夸张倍数（真实仰角太小，需放大才好看）
  orbitDisplayExaggeration: 2.5
  # 单条航线脉冲：绘制动画时长（毫秒）
  routeDrawMs: 1400
  # 绘制完成后停留时长（毫秒）
  routeHoldMs: 16000
  # 停留后淡出时长（毫秒）
  routeFadeMs: 4000
  # 网卡流量监视：网卡名；null=自动取默认路由网卡
  nicIface: null
  # 网卡流量采样间隔（毫秒），经 WS 推送上下行速率
  nicSampleMs: 1000
  # 脉冲 WS 冲刷间隔（毫秒）：越小越接近连续流；压测中用此节奏推送而非合批跳频
  pulseStreamMs: 16
  # 单客户端 WS 发送缓冲上限（字节）；超过则丢弃本帧脉冲（淘汰积压旧数据，不撑爆前端）
  wsMaxBufferedBytes: 1048576

# ---------- 测试工具：热路径压测（npm run stress:hot → POST flight:map /api/stress；主页无 UI） ----------
# 策略：低并发 + 完成即补位（高频泵）；软公平复用热连接；间歇严格公平保证慢/冷 IP 仍会打到
stressTest:
  # 同时 in-flight 上限；建议 32~128，勿用 300+（易把事件循环和慢槽拖死）
  concurrency: 64
  total: 100000
  # null=用 rocktree + planetoidPath
  url: null
  waitHot: true
  waitHotMs: 120000
  # 压测单次超时（毫秒）：只释放被慢请求占住的并发槽；不把慢 IP 排除出选路
  requestTimeoutMs: 3000
